name: Construieste aplicatia iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  ipa:
    # Intel Mac: GitHub's Apple-silicon pool keeps dropping queued jobs ("not acquired by Runner")
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Alege cel mai nou Xcode stabil
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Instaleaza Capacitor
        run: npm install --no-audit --no-fund

      - name: Creeaza proiectul iOS
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Orizontal, ecran complet, iconita si splash
        run: |
          PL=ios/App/App/Info.plist
          PB=/usr/libexec/PlistBuddy
          $PB -c "Delete :UISupportedInterfaceOrientations" "$PL" || true
          $PB -c "Add :UISupportedInterfaceOrientations array" "$PL"
          $PB -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeRight" "$PL"
          $PB -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeLeft" "$PL"
          $PB -c "Delete :UISupportedInterfaceOrientations~ipad" "$PL" || true
          $PB -c "Add :UISupportedInterfaceOrientations~ipad array" "$PL"
          $PB -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeRight" "$PL"
          $PB -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeLeft" "$PL"
          $PB -c "Set :UIViewControllerBasedStatusBarAppearance false" "$PL" || $PB -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$PL"
          $PB -c "Set :UIStatusBarHidden true" "$PL" || $PB -c "Add :UIStatusBarHidden bool true" "$PL"
          $PB -c "Set :UIRequiresFullScreen true" "$PL" || $PB -c "Add :UIRequiresFullScreen bool true" "$PL"
          $PB -c "Set :CFBundleDisplayName Blitz Squad" "$PL" || $PB -c "Add :CFBundleDisplayName string Blitz Squad" "$PL"
          $PB -c "Set :NSLocalNetworkUsageDescription Blitz Squad se conecteaza direct la telefoanele prietenilor pentru meciurile din camera." "$PL" || $PB -c "Add :NSLocalNetworkUsageDescription string Blitz Squad se conecteaza direct la telefoanele prietenilor pentru meciurile din camera." "$PL"
          for f in ios/App/App/Assets.xcassets/AppIcon.appiconset/*.png; do cp resources/icon-1024.png "$f"; done
          for f in ios/App/App/Assets.xcassets/Splash.imageset/*.png; do cp resources/splash-2732.png "$f"; done

      - name: Compileaza fara semnatura
        run: |
          if [ -d ios/App/App.xcworkspace ]; then SRC="-workspace ios/App/App.xcworkspace"; else SRC="-project ios/App/App.xcodeproj"; fi
          set -o pipefail
          xcodebuild $SRC -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -skipPackagePluginValidation -skipMacroValidation build | tail -n 80

      - name: Impacheteaza IPA
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" -type d | head -1)
          echo "Aplicatia: $APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry ../BlitzSquad.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: BlitzSquad-ipa
          path: BlitzSquad.ipa
          retention-days: 30
